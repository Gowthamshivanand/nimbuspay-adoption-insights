<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NimbusPay Adoption Insights (live product)</title><link rel="stylesheet" href="/static/style.css"></head>
<body>
<header>
  <div class="brand"><b>NimbusPay</b> Adoption Insights <span class="pill">live product</span><span class="pill syn">SYNTHETIC DATA</span></div>
  <div class="ctrl">
    <div class="roles" data-testid="role-switch" title="Role switch: scope is enforced on the server, the UI only sends the role name">
      <span class="muted">Role</span>
      <button type="button" class="role" data-role="manager" data-testid="role-manager">Manager</button>
      <button type="button" class="role" data-role="analyst" data-testid="role-analyst">Analyst</button>
      <button type="button" class="role" data-role="guest" data-testid="role-guest">Guest</button>
      <select id="persona" data-testid="persona" aria-label="All roles"></select>
    </div>
    <span id="ds" class="muted"></span>
  </div>
</header>
<nav id="tabs"></nav>
<main id="view"></main>
<footer class="muted">Read-only. Every number is synthetic and labelled; thresholds and weights are placeholders to agree. Metric version <span id="ver">v1.0</span>. Built by Gowtham S.</footer>
<script src="/static/app.js"></script>
</body></html>
