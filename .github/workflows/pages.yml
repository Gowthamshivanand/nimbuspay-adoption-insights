name: Deploy to GitHub Pages
# Publishes the v2 static demo (VITE_STATIC=1, recorded golden responses, banner) built by tools/build_pages_demo.sh.
# The committed app/web build, the Python app and Docker are not touched (static mode is off by default).
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install front-end dependencies
        run: cd web && npm ci
      - name: Build the static v2 demo
        run: bash tools/build_pages_demo.sh "$GITHUB_WORKSPACE/_site"
      - name: Check the site
        run: test -f _site/index.html && test -f _site/404.html && test -f _site/.nojekyll && if [ -f CNAME ]; then cp CNAME _site/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
