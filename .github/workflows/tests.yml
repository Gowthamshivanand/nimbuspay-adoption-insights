name: Tests
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m pytest -q tests/test_pipeline.py tests/test_agent.py tests/test_probes.py tests/test_persona.py tests/test_api.py tests/test_features.py tests/test_brain.py tests/test_cost.py tests/test_improvements.py tests/test_break_it.py tests/test_space.py tests/test_finetuned.py tests/test_remote_brain.py tests/test_demo_hardening.py
      - run: python tools/eval_agent.py --brain rules   # release gate: golden 21/21 and every probe
      - run: python tools/break_it.py   # try-to-break-it set: 22 adversarial cases must be handled by the right guard
